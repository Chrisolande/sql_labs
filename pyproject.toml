[project]
name = "sql_labs"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "aiolimiter>=1.2.1",
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "black>=26.5.1",
    "fastapi>=0.139.0",
    "google>=3.0.0",
    "google-api-core>=2.31.0",
    "httpx>=0.28.1",
    "httpx-retries>=0.5.0",
    "iprogress>=0.4",
    "ipykernel>=7.3.0",
    "ir-measures>=0.4.3",
    "langchain>=1.3.11",
    "langchain-deepseek>=1.1.0",
    "langchain-google-genai>=4.2.6",
    "langchain-nvidia-ai-endpoints>=1.4.3",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.7",
    "langgraph-checkpoint-postgres>=3.1.0",
    "langgraph-cli>=0.4.30",
    "langsmith>=0.9.7",
    "loguru>=0.7.3",
    "mcp>=1.6.0",
    "openevals>=0.2.0",
    "pgvector>=0.4.2",
    "pre-commit>=4.6.0",
    "prometheus-client>=0.25.0",
    "psycopg-pool>=3.3.1",
    "psycopg2-binary>=2.9.12",
    "psycopg[binary]>=3.3.4",
    "pyautogui>=0.9.54",
    "pydantic-settings>=2.14.2",
    "pyjwt[crypto]>=2.13.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.20",
    "scikit-learn>=1.9.0",
    "sqlalchemy>=2.0.51",
    "tenacity>=9.1.4",
    "transformers>=5.13.0",
    "uvicorn>=0.50.2",
    "typer>=0.12.3",
    "optuna>=3.6.1",
    "more-itertools>=11.1.0",
]


[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101", "B106"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "UP", "SIM", "C4"]
ignore = ["E501"]

[project.scripts]
careerpilot-worker = "app.workers.agent_worker:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
]
