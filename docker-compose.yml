networks:
  careerpilot_network:
    driver: bridge
services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    container_name: careerpilot-db
    command: postgres -c shared_preload_libraries=pg_textsearch
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - careerpilot_network
  app:
    build: .
    container_name: careerpilot-app
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - LANGSMITH_TRACING=true
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    command: uv run alembic upgrade head
    networks:
      - careerpilot_network
  jdl-daemon:
    build: .
    container_name: careerpilot-jdl-daemon
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - LANGSMITH_TRACING=true
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_completed_successfully
    restart: unless-stopped
    command: uv run python -m app.scripts.jdl_daemon
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - careerpilot_network
